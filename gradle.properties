# The test worker classpath is passed to java.exe via an @argfile, which the launcher reads using the
# OS native encoding. Using COMPAT keeps Gradle writing it in that same encoding, avoiding
# ClassNotFoundException when the project path contains non-ASCII characters (e.g. "Diseño").
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=384m -Dfile.encoding=COMPAT
